<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de HTML</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>Quiz de Conhecimentos de HTML</h1>

    <table>
      <thead>
        <tr>
          <th>Pergunta</th>
          <th>A</th>
          <th>B</th>
          <th>C</th>
          <th>D</th>
        </tr>
      </thead>

      <tbody>

        <!-- Pergunta 1 -->
        <tr>
          <td>1. O que significa HTML?</td>

          <td>
            <label>
              <input type="radio" name="q1" value="A">
              HyperText Markup Language
            </label>
          </td>

          <td>
            <label>
              <input type="radio" name="q1" value="B">
              HighText Machine Language
            </label>
          </td>

          <td>
            <label>
              <input type="radio" name="q1" value="C">
              HyperTool Multi Language
            </label>
          </td>

          <td>
            <label>
              <input type="radio" name="q1" value="D">
              HomeText Markup Language
            </label>
          </td>
        </tr>

        <!-- Pergunta 2 -->
        <tr>
          <td>2. Qual tag é usada para criar um título principal?</td>

          <td>
            <label>
              <input type="radio" name="q2" value="A">
              &lt;p&gt;
            </label>
          </td>

          <td>
            <label>
              <input type="radio" name="q2" value="B">
              &lt;h1&gt;
            </label>
          </td>

          <td>
            <label>
              <input type="radio" name="q2" value="C">
              &lt;title&gt;
            </label>
          </td>

          <td>
            <label>
              <input type="radio" name="q2" value="D">
              &lt;header&gt;
            </label>
          </td>
        </tr>

        <!-- Pergunta 3 -->
        <tr>
          <td>3. Qual tag é usada para criar um link?</td>

          <td>
            <label>
              <input type="radio" name="q3" value="A">
              &lt;link&gt;
            </label>
          </td>

          <td>
            <label>
              <input type="radio" name="q3" value="B">
              &lt;url&gt;
            </label>
          </td>

          <td>
            <label>
              <input type="radio" name="q3" value="C">
              &lt;a&gt;
            </label>
          </td>

          <td>
            <label>
              <input type="radio" name="q3" value="D">
              &lt;href&gt;
            </label>
          </td>
        </tr>

        <!-- Pergunta 4 -->
        <tr>
          <td>4. Qual tag é usada para inserir uma imagem?</td>

          <td>
            <label>
              <input type="radio" name="q4" value="A">
              &lt;image&gt;
            </label>
          </td>

          <td>
            <label>
              <input type="radio" name="q4" value="B">
              &lt;img&gt;
            </label>
          </td>

          <td>
            <label>
              <input type="radio" name="q4" value="C">
              &lt;picture&gt;
            </label>
          </td>

          <td>
            <label>
              <input type="radio" name="q4" value="D">
              &lt;src&gt;
            </label>
          </td>
        </tr>

        <!-- Pergunta 5 -->
        <tr>
          <td>5. Qual tag é usada para criar um parágrafo?</td>

          <td>
            <label>
              <input type="radio" name="q5" value="A">
              &lt;text&gt;
            </label>
          </td>

          <td>
            <label>
              <input type="radio" name="q5" value="B">
              &lt;paragraph&gt;
            </label>
          </td>

          <td>
            <label>
              <input type="radio" name="q5" value="C">
              &lt;h1&gt;
            </label>
          </td>

          <td>
            <label>
              <input type="radio" name="q5" value="D">
              &lt;p&gt;
            </label>
          </td>
        </tr>

      </tbody>
    </table>

    <button id="btnEnviar">Enviar respostas</button>

    <div id="resultado"></div>

  </div>

  <script src="script.js"></script>

</body>
</html>
